{% extends "home/base.html" %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="mb-4">{% if form.instance.pk %}Update Product{% else %}Add Product{% endif %}</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'product-list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
