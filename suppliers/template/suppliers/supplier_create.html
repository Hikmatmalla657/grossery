{% extends "home/base.html" %}

{% block content %}
<div class="supplier-card shadow-sm p-4">
    <h2 class="h4 mb-3">Add Supplier</h2>
    <form method="post" class="supplier-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'supplier-list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
