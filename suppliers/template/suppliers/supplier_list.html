{% extends "base.html" %}

{% block content %}
    <h1>Delete Supplier</h1>
    <p>Are you sure you want to delete this supplier?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, Delete</button>
        <a href="{% url 'supplier_list' %}">Cancel</a>
</form>
{% endblock %}
