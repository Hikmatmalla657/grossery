{% extends "home/base.html" %}

{% block content %}
<style>
    .delete-card { max-width: 34rem; margin: 3rem auto; padding: 2rem; background: #fff; border: 1px solid #fecaca; border-radius: 1rem; box-shadow: 0 10px 28px rgba(15, 23, 42, .08); }
    .delete-card h1 { margin: 0 0 .75rem; color: #b42318; font-size: 1.55rem; }
    .delete-card p { color: #475467; line-height: 1.6; }
    .delete-card .actions { display: flex; justify-content: flex-end; gap: .75rem; margin-top: 1.5rem; }
</style>

<section class="delete-card">
    <h1>Delete order #{{ object.order_id }}?</h1>
    <p>This will permanently remove this order. This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <a class="btn btn-outline-secondary" href="{% url 'order_list' %}">Cancel</a>
            <button class="btn btn-danger" type="submit">Delete order</button>
        </div>
    </form>
</section>
{% endblock %}
