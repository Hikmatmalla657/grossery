{% extends "home/base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 section-header">
    <h2>Order List</h2>
    <a href="{% url 'order-create' %}" class="btn btn-primary">Add Order</a>
</div>

<table class="table app-table table-striped table-bordered">
    <thead class="table-dark">
        <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Date</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for order in orders %}
        <tr>
            <td data-label="Order ID">{{ order.order_id }}</td>
            <td data-label="Customer">{{ order.customer.name }}</td>
            <td data-label="Date">{{ order.order_date }}</td>
            <td data-label="Status">{{ order.status }}</td>
            <td data-label="Actions">
                <a href="{% url 'order-update' order.order_id %}" class="btn btn-sm btn-warning">Edit</a>
                <a href="{% url 'order-delete' order.order_id %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="5" class="text-center">No orders found.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
