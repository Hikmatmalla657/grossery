{%extends "home/base.html"%}
<div>
    {%block content%} 
    <h2>User List</h2>
    <a href="{%url 'add_user'%}" class="btn btn-primary">Add User</a>
    <table class = "table table-striped">
        <thead>
            <tr>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{user.username}}</td>
                <td>{{user.email}}</td>
                <td>{{user.role}}</td>
                <td>{{user.address}}</td>
                <td>{{user.phone}}</td>
                <td>
                    <a href="{%url 'update_user' user.id%}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="{%url 'delete_user' user.id%}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
